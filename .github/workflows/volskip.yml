name: Volume skip (Xposed module)

on:
  workflow_dispatch:
  push:
    branches: [tools-volskip]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | grep -E "android-3[0-6]$" | sort -V | tail -1)
          mkdir -p out/stubs out/classes out/dex
          "$BT/aapt2" compile --dir res -o out/res.zip
          "$BT/aapt2" link -o out/base.apk --manifest AndroidManifest.xml -I "$PLAT/android.jar" -A assets out/res.zip
          javac --release 11 -Xlint:-options -cp "$PLAT/android.jar" -d out/stubs $(find stubs -name '*.java')
          javac --release 11 -Xlint:-options -cp "$PLAT/android.jar:out/stubs" -d out/classes $(find src -name '*.java')
          "$BT/d8" --release --min-api 30 --lib "$PLAT/android.jar" --classpath out/stubs --output out/dex $(find out/classes -name '*.class')
          (cd out/dex && zip -q ../base.apk classes.dex)
          "$BT/zipalign" -f -p 4 out/base.apk out/aligned.apk
          keytool -genkeypair -keystore out/k.jks -storepass volskip -keypass volskip -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname CN=VolSkip >/dev/null 2>&1
          "$BT/apksigner" sign --ks out/k.jks --ks-pass pass:volskip --key-pass pass:volskip --out VolSkip.apk out/aligned.apk
          "$BT/aapt2" dump badging VolSkip.apk | head -2
          unzip -l VolSkip.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "volskip-${{ github.run_number }}" VolSkip.apk --target "$GITHUB_SHA" \
            --title "Volume skip #${{ github.run_number }}" \
            --notes "LSPosed module: screen off + music, hold Volume Up = next track, hold Volume Down = previous. Scope: System Framework."
